# Atualização diária do painel do Diagnóstico da EEQ (ENFMQ)
#
# O que isto faz, em português: todo dia às 6h (horário de Brasília), o GitHub
# liga uma máquina, baixa este repositório, roda o atualizar_dados.py (que lê a
# planilha e gera um index.html novo), salva o arquivo novo no repositório e
# publica a página no GitHub Pages.
#
# Também roda:
#   - na hora, pelo botão: aba "Actions" → "Atualizar painel" → "Run workflow";
#   - quando alguém altera o template.html ou o atualizar_dados.py no repositório,
#     para a mudança de desenho aparecer no site sem esperar o dia seguinte.

name: Atualizar painel

on:
  schedule:
    # Três vezes por dia, para garantir: se o GitHub pular um horário (acontece
    # em momentos de muito uso), o seguinte cobre.
    # cron usa o horário de Greenwich (UTC), 3 horas à frente de Brasília:
    #   9h UTC = 6h07 · 15h UTC = 12h07 · 2h UTC = 23h07 (horário de Brasília)
    # campos: minuto hora dia-do-mês mês dia-da-semana
    - cron: "7 2,9,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["template.html", "atualizar_dados.py", ".github/workflows/atualizar.yml"]

permissions:
  contents: write    # salvar o index.html novo no repositório
  pages: write       # publicar no GitHub Pages
  id-token: write    # o Pages exige esta permissão para confirmar quem está publicando

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o painel a partir da planilha
        env:
          # o link da planilha fica guardado como segredo (ver README.md),
          # nunca escrito aqui: ele dá acesso a dados pessoais das estudantes
          PLANILHA_CSV_URL: ${{ secrets.PLANILHA_CSV_URL }}
        run: python atualizar_dados.py

      - name: Salvar o index.html novo no repositório, se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Nada mudou desde a última atualização."
          else
            git commit -m "Atualiza painel com as respostas de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi

      # Para o site vão só a página, o manifesto e os ícones. O script, o
      # template e a lista de municípios ficam no repositório, mas não viram
      # páginas públicas.
      - name: Separar o que vai para o site
        # a página, o manifesto e os ícones que permitem instalar o painel como app
        run: mkdir _site && cp index.html manifest.webmanifest sw.js icone-*.png _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
